name: Required diagnostics review

on:
  pull_request:

jobs:
  acknowledgement:
    runs-on: ubuntu-latest
    steps:
      - name: Require the diagnostics-review acknowledgement
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -Fq '[x] He revisado todos los manifiestos, logs y capturas PNG nuevos de `diagnostics-reports`.' || {
            echo 'The mandatory diagnostics review acknowledgement is missing.' >&2
            exit 1
          }
